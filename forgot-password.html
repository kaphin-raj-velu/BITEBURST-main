<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - BiteBurst</title>
    <link rel="stylesheet" href="auth.css">
    <style>
        .auth-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #forgotMsg {
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="auth-card">
        <h2>Reset Password</h2>
        <form id="forgotPasswordForm">
            <div class="input-group">
                <input type="email" id="forgotEmail" required placeholder=" ">
                <label for="forgotEmail">Email</label>
            </div>

            <div class="input-group">
                <input type="password" id="forgotNewPassword" required placeholder=" ">
                <label for="forgotNewPassword">New Password</label>
                <span class="toggle-password" onclick="togglePassword('forgotNewPassword')">👁️</span>
            </div>

            <button type="submit">Reset Password</button>
        </form>

        <!-- Feedback message will appear here -->
        <p id="forgotMsg"></p>

        <p class="redirect-text">
            Remembered your password? <a href="login.html">Login</a>
        </p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
